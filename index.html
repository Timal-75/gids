const EVIDENCE=[
 {group:T(`Les traces de tes nuits ailleurs`,`Sporen van je nachten elders`),intro:T(`Aucune de ces traces ne suffit seule. Ensemble et datées, elles montrent où ta vie se passait.`,`Geen van deze sporen is op zichzelf genoeg. Samen en met datum laten ze zien waar je leven zich afspeelde.`),items:[
  {id:'bank',t:T(`Relevés bancaires des mois examinés`,`Bankafschriften van de onderzochte maanden`),d:T(`Les lieux et les heures des paiements par carte, surtout tôt le matin et tard le soir.`,`Plaats en tijd van pinbetalingen, vooral vroeg in de ochtend en laat op de avond.`)},
  {id:'ov',t:T(`Historique de tes trajets en transports`,`Je reishistorie in het openbaar vervoer`),d:T(`À télécharger vite : l’historique en ligne ne remonte pas indéfiniment.`,`Download het snel: de online historie gaat niet eindeloos terug.`)},
  {id:'loc',t:T(`Historique de position de ton téléphone`,`Locatiegeschiedenis van je telefoon`),d:T(`S’il était activé, il montre où le téléphone passait la nuit.`,`Als die aanstond, laat hij zien waar je telefoon ’s nachts was.`)},
  {id:'msg',t:T(`Messages où tu organises tes nuits`,`Berichten waarin je je slaapplek regelt`),d:T(`« Je peux dormir chez toi ce soir ? », avec la date visible. Captures complètes, non retouchées.`,`‘Kan ik vanavond bij jou slapen?’, met de datum zichtbaar. Volledige, onbewerkte schermafbeeldingen.`)},
  {id:'photo',t:T(`Photos et vidéos datées prises là où tu dormais`,`Gedateerde foto’s en video’s van de plekken waar je sliep`)},
  {id:'work',t:T(`Planning de travail, d’études ou de stage`,`Werk-, studie- of stagerooster`),d:T(`Avec l’adresse : il montre d’où tu partais le matin.`,`Met het adres: het laat zien waarvandaan je ’s ochtends vertrok.`)},
  {id:'sub',t:T(`Livraisons, abonnements, salle de sport, bibliothèque`,`Bezorgingen, abonnementen, sportschool, bibliotheek`)}]},
 {group:T(`Les personnes qui t’ont hébergée`,`De mensen bij wie je sliep`),intro:T(`Une attestation vaut par sa précision. « Elle n’habite pas chez sa mère » ne prouve rien. « Elle a dormi chez moi du lundi au jeudi de mars à juin, sur le canapé, et laissait un sac dans le couloir » prouve quelque chose.`,`Een verklaring is zoveel waard als ze precies is. ‘Ze woont niet bij haar moeder’ bewijst niets. ‘Ze sliep van maart tot juni van maandag tot donderdag bij mij op de bank en liet een tas in de gang staan’ bewijst wel iets.`),items:[
  {id:'host',t:T(`Une attestation datée et signée de chaque hôte`,`Een gedateerde en ondertekende verklaring van elke gastheer of gastvrouw`),d:T(`Lettre type n° 4. Uniquement des faits vrais et vécus : une fausse attestation est une infraction pour celui qui la signe.`,`Voorbeeldbrief 4. Alleen ware feiten die iemand zelf heeft meegemaakt: een valse verklaring is strafbaar voor wie tekent.`)},
  {id:'hostp',t:T(`Ce qui recoupe leurs attestations`,`Wat hun verklaringen ondersteunt`),d:T(`Leurs propres messages, des photos, un double de clés, une participation aux courses.`,`Hun eigen berichten, foto’s, een reservesleutel, een bijdrage aan de boodschappen.`)},
  {id:'early',t:T(`Les remettre tôt`,`Vroeg inleveren`),d:T(`Une attestation donnée au début pèse plus qu’une attestation qui arrive après une décision défavorable.`,`Een verklaring die aan het begin wordt gegeven, weegt zwaarder dan een die na een ongunstig besluit komt.`)}]},
 {group:T(`Tes papiers`,`Je papieren`),items:[
  {id:'brp',t:T(`Extrait du registre avec l’historique de tes adresses`,`Uittreksel BRP met adreshistorie`)},
  {id:'mail',t:T(`Où arrive ton courrier : banque, employeur, assurance, médecin`,`Waar je post aankomt: bank, werkgever, verzekering, huisarts`)},
  {id:'gp',t:T(`Médecin, pharmacie, dentiste : où tu es inscrite et où tu vas`,`Huisarts, apotheek, tandarts: waar je staat ingeschreven en waar je heen gaat`)},
  {id:'rent',t:T(`Tout contrat ou paiement de logement`,`Elk contract of elke betaling voor woonruimte`),d:T(`Sous-location, participation aux frais chez un hôte.`,`Onderhuur, een bijdrage in de kosten bij een gastheer.`)}]},
 {group:T(`Du côté de ta mère`,`Aan de kant van je moeder`),items:[
  {id:'rep',t:T(`Copies de tout ce qu’elle a déjà déclaré sur son logement`,`Kopieën van alles wat ze al over haar woonsituatie heeft doorgegeven`)},
  {id:'med',t:T(`Documents médicaux récents`,`Recente medische stukken`),d:T(`Sa maladie compte pour l’amende et pour la proportionnalité, et elle explique que tu passes l’aider.`,`Haar ziekte telt mee voor de boete en voor de evenredigheid, en verklaart waarom je langskomt om te helpen.`)},
  {id:'things',t:T(`Une liste honnête de ce que tu gardes chez elle, et pourquoi`,`Een eerlijke lijst van wat je bij haar bewaart, en waarom`),d:T(`Mieux vaut l’expliquer vous-mêmes que le laisser découvrir.`,`Beter dat jullie het zelf uitleggen dan dat het wordt ontdekt.`)},
  {id:'water',t:T(`Factures d’eau et d’énergie de la période`,`Water- en energierekeningen van de periode`),d:T(`Une consommation normale pour une personne seule est un bon point.`,`Een verbruik dat normaal is voor één persoon, is een pluspunt.`)}]},
 {group:T(`À partir d’aujourd’hui`,`Vanaf vandaag`),items:[
  {id:'log',t:T(`Un agenda de tes nuits, avec une trace pour chacune`,`Een agenda van je nachten, met bij elke nacht een spoor`),d:T(`Un carnet seul pèse peu. Un carnet appuyé par des messages ou des paiements pèse.`,`Een logboek alleen telt weinig. Een logboek dat door berichten of betalingen wordt gesteund, telt wel.`)}]}
];
const DODONT=[
 {title:T(`Pendant l’entretien`,`Tijdens het gesprek`),
  do:[T(`Venir accompagnée d’un avocat ou d’une personne de confiance.`,`Een advocaat of vertrouwenspersoon meenemen.`),T(`Demander au début sur quoi porte l’entretien et sur quelle période.`,`Aan het begin vragen waar het gesprek over gaat en over welke periode.`),T(`Répondre à la question posée, simplement, sans en rajouter.`,`Antwoord geven op de gestelde vraag, eenvoudig, zonder uit te weiden.`),T(`Dire « je ne sais plus » quand c’est le cas.`,`‘Dat weet ik niet meer’ zeggen als dat zo is.`),T(`Demander une pause si la fatigue ou la maladie pèse.`,`Om een pauze vragen als vermoeidheid of ziekte meespeelt.`),T(`Relire, faire corriger, garder une copie.`,`Nalezen, laten verbeteren, een kopie meenemen.`)],
  dont:[T(`Deviner des dates ou un nombre de nuits.`,`Data of een aantal nachten gokken.`),T(`Dire oui pour en finir.`,`Ja zeggen om ervan af te zijn.`),T(`Parler à la place de l’autre : chacune répond pour elle-même.`,`Voor de ander antwoorden: ieder spreekt voor zichzelf.`),T(`Arranger les faits. Les réponses de la mère et de la fille seront comparées.`,`De feiten mooier maken. De antwoorden van moeder en dochter worden naast elkaar gelegd.`),T(`Signer sous la pression ou sans comprendre.`,`Tekenen onder druk of zonder het te begrijpen.`)]},
 {title:T(`Pendant la visite à domicile`,`Tijdens het huisbezoek`),
  do:[T(`Demander la carte professionnelle et le motif concret de la visite.`,`Naar de legitimatie en de concrete aanleiding van het bezoek vragen.`),T(`Demander ce qu’un refus entraînerait.`,`Vragen wat een weigering zou betekenen.`),T(`Appeler quelqu’un pour être présent, ou l’avocat.`,`Iemand bellen om erbij te zijn, of de advocaat.`),T(`Accompagner les enquêteurs dans chaque pièce.`,`Met de onderzoekers meelopen naar elke kamer.`),T(`Dire non à ce qui n’a pas de rapport : l’accord se donne étape par étape, et la visite sert à voir qui habite là, pas à tout fouiller.`,`Nee zeggen tegen wat er niets mee te maken heeft: toestemming geef je stap voor stap, en het bezoek dient om te zien wie er woont, niet om alles te doorzoeken.`),T(`Expliquer simplement à qui sont les affaires et pourquoi elles sont là.`,`Eenvoudig uitleggen van wie de spullen zijn en waarom ze er liggen.`),T(`Noter les noms, l’heure, ce qui a été ouvert et photographié.`,`Namen, tijdstip en wat er is geopend en gefotografeerd noteren.`)],
  dont:[T(`Mettre le logement en scène avant : si un voisin ou une observation dit le contraire, plus rien de ce que vous dites n’est cru.`,`De woning vooraf ‘klaarzetten’: zegt een buur of een waarneming iets anders, dan wordt niets meer geloofd van wat jullie zeggen.`),T(`Laisser entrer sans avoir compris pourquoi.`,`Binnenlaten zonder te begrijpen waarom.`),T(`Mentir sur le propriétaire des affaires.`,`Liegen over van wie de spullen zijn.`),T(`Fermer la porte sans proposer une autre façon de prouver la situation.`,`De deur dichtdoen zonder een andere manier aan te bieden om de situatie aan te tonen.`),T(`Signer le rapport sur place sans le lire.`,`Het verslag ter plekke tekenen zonder het te lezen.`)]}
];

const STEPS=[
 {t:T(`La lettre d’annonce ou la demande de pièces`,`De aankondiging of het verzoek om stukken`),d:T(`Répondez dans le délai indiqué, par écrit. C’est le moment de prendre un avocat.`,`Reageer binnen de genoemde termijn, schriftelijk. Dit is het moment om een advocaat te zoeken.`)},
 {t:T(`L’enquête`,`Het onderzoek`),d:T(`Entretien, visite, données demandées à des tiers. Elle peut durer des semaines ou des mois. S’il manque des pièces, l’aide peut être suspendue huit semaines au plus.`,`Gesprek, huisbezoek, gegevens die bij derden worden opgevraagd. Het kan weken of maanden duren. Ontbreken er stukken, dan kan de uitkering hoogstens acht weken worden opgeschort.`)},
 {t:T(`Votre réaction avant la décision`,`Jullie reactie vóór het besluit`),d:T(`Avant une amende, vous recevez le rapport et vous pouvez donner votre version (zienswijze). Pour le remboursement, l’administration n’est pas toujours tenue de vous entendre avant.`,`Vóór een boete krijgen jullie het rapport en mogen jullie een zienswijze geven. Bij terugvordering hoeft de overheid jullie niet altijd vooraf te horen.`)},
 {t:T(`La décision`,`Het besluit`),d:T(`Elle doit dire quoi, pour quelle période, sur quelles preuves, et comment la contester. Le remboursement et l’amende font l’objet de deux décisions.`,`Het moet vermelden wat, over welke periode, op welk bewijs, en hoe je ertegen opkomt. Terugvordering en boete zijn twee besluiten.`)},
 {t:T(`L’objection`,`Het bezwaar`),d:T(`Six semaines, gratuite, par lettre. Vous êtes entendues à une audience. La commune répond en principe 6 à 12 semaines après la fin du délai d’objection ; l’UWV dans les 13 semaines.`,`Zes weken, gratis, per brief. Jullie worden gehoord op een hoorzitting. De gemeente beslist in principe 6 tot 12 weken na afloop van de bezwaartermijn; het UWV binnen 13 weken.`)},
 {t:T(`Le tribunal`,`De rechtbank`),d:T(`Six semaines après la décision sur objection. Frais de greffe : 54 € au tarif réduit en 2026, remboursés si vous gagnez.`,`Zes weken na de beslissing op bezwaar. Griffierecht: € 54 tegen het lage tarief in 2026, terug te krijgen als jullie winnen.`)},
 {t:T(`L’appel`,`Hoger beroep`),d:T(`Six semaines après le jugement, devant la Centrale Raad van Beroep. Frais de greffe : 147 € au tarif réduit en 2026.`,`Zes weken na de uitspraak, bij de Centrale Raad van Beroep. Griffierecht: € 147 tegen het lage tarief in 2026.`)},
 {t:T(`À tout moment : l’urgence`,`Op elk moment: spoed`),d:T(`Si l’aide est coupée et qu’il n’y a plus de quoi vivre, le tribunal peut ordonner une mesure provisoire en quelques semaines, à condition qu’une objection ait été envoyée.`,`Is de uitkering gestopt en is er geen geld meer om van te leven, dan kan de rechtbank binnen enkele weken een voorlopige voorziening treffen, mits er bezwaar is gemaakt.`)}
];
/*END:steps*/

const HEADER=`[Naam]
[Adres]

const LETTERS=[
 {title:T(`1. Demander tout le dossier`,`1. Het hele dossier opvragen`),
  about:T(`Signée par ta mère (c’est son aide qui est en jeu). À envoyer dès que l’enquête est connue, puis de nouveau après une décision. Envoi recommandé ou dépôt contre reçu, avec une copie gardée.`,`Ondertekend door je moeder (het gaat om haar uitkering). Versturen zodra het onderzoek bekend is, en opnieuw na een besluit. Aangetekend versturen of afgeven tegen ontvangstbewijs, en een kopie bewaren.`),
  text:HEADER+`
Betreft: verzoek om toezending van alle stukken
Uw kenmerk: [kenmerk uit de brief]
Burgerservicenummer: [BSN]

Geachte heer, mevrouw,

U doet onderzoek naar mijn woonsituatie. [Of: U hebt op (datum) een besluit genomen over mijn uitkering.] Om goed te kunnen reageren, verzoek ik u mij binnen twee weken een kopie te sturen van alle stukken die op mijn zaak betrekking hebben.

Ik baseer dit verzoek op artikel 15 van de Algemene verordening gegevensbescherming, in de bezwaarfase ook op artikel 7:4 van de Algemene wet bestuursrecht, en bij een voorgenomen boete op artikel 5:49 van die wet.

Ik vraag in elk geval om:
1. het volledige onderzoeksrapport met alle bijlagen;
2. de melding of het signaal dat aanleiding gaf tot het onderzoek, zo nodig geanonimiseerd;
3. de verslagen van alle waarnemingen, met data, tijdstippen, duur en de naam of het nummer van de waarnemer;
4. de verslagen van de gesprekken en van het huisbezoek, met de ondertekende verklaringen;
5. de verklaringen van getuigen of buurtbewoners, zo nodig geanonimiseerd;
6. de gegevens die u bij derden hebt opgevraagd, zoals waterverbruik, bankgegevens en gegevens uit de basisregistratie personen;
7. de berekening per maand van het bedrag dat u wilt herzien of terugvorderen.

Zolang ik deze stukken niet heb, kan ik niet volledig reageren. Ik verzoek u daarom geen besluit te nemen [of: geen hoorzitting te houden] voordat ik de stukken heb ontvangen en een redelijke termijn heb gehad om te reageren.

Met vriendelijke groet,

[Handtekening]
[Naam]`},
 {title:T(`2. Objection provisoire contre une décision`,`2. Pro-formabezwaar tegen een besluit`),
  about:T(`Signée par ta mère. Elle sert à ne pas rater le délai de six semaines : les arguments viendront après lecture du dossier, avec l’avocat. Une lettre par décision (remboursement, amende). Joindre une copie de la décision.`,`Ondertekend door je moeder. De brief stelt de termijn van zes weken veilig: de gronden volgen na het lezen van het dossier, samen met de advocaat. Eén brief per besluit (terugvordering, boete). Voeg een kopie van het besluit bij.`),
  text:HEADER+`
Betreft: pro forma bezwaarschrift tegen uw besluit van [datum], kenmerk [kenmerk]
Burgerservicenummer: [BSN]

Geachte heer, mevrouw,

Hierbij maak ik bezwaar tegen uw besluit van [datum], kenmerk [kenmerk], waarbij u [mijn uitkering hebt herzien / mijn uitkering hebt ingetrokken / een bedrag van € … van mij terugvordert / mij een boete hebt opgelegd]. Een kopie van het besluit is bijgevoegd.

Ik ben het niet eens met dit besluit. Het berust op een onjuiste vaststelling van de feiten en is onvoldoende gemotiveerd.

Dit bezwaarschrift dient om de termijn veilig te stellen. Ik verzoek u:
1. mij een kopie te sturen van alle op de zaak betrekking hebbende stukken (artikel 7:4 Awb);
2. mij een termijn van vier weken na ontvangst van die stukken te geven om de gronden van mijn bezwaar aan te vullen (artikel 6:6 Awb);
3. mij uit te nodigen voor een hoorzitting (artikel 7:2 Awb);
4. de invordering op te schorten totdat op mijn bezwaar is beslist;
5. de kosten die ik in bezwaar maak te vergoeden als het besluit wordt herroepen (artikel 7:15 Awb).

Met vriendelijke groet,

[Handtekening]
[Naam]

Bijlage: kopie van het besluit`},
 {title:T(`3. Demander une adresse postale`,`3. Een briefadres aanvragen`),
  about:T(`Signée par toi, pour le service de l’état civil de la commune où tu séjournes. Beaucoup de communes ont un formulaire : la lettre sert alors d’accompagnement. La commune va te demander où tu dors : réponds précisément, c’est ce qui fait accepter ou refuser la demande.`,`Ondertekend door jou, voor de afdeling Burgerzaken van de gemeente waar je verblijft. Veel gemeenten hebben een formulier: de brief dient dan als begeleidend schrijven. De gemeente zal vragen waar je slaapt: antwoord precies, want daar hangt toewijzing of afwijzing van af.`),
  text:`[Naam]
[Geboortedatum]
[Telefoonnummer en e-mailadres]

Aan: gemeente [naam], afdeling Burgerzaken
[Adres van de gemeente]

[Plaats], [datum]

Betreft: aangifte van een briefadres
Burgerservicenummer: [BSN]

Geachte heer, mevrouw,

Ik heb op dit moment geen woonadres. Ik overnacht wisselend op verschillende adressen en er is geen adres waar ik naar verwachting een half jaar lang de meeste nachten zal doorbrengen. Ik verblijf wel in uw gemeente.

De laatste tijd overnacht ik vooral op de volgende plekken: [eerlijk opsommen: bij wie, in welke plaats, ongeveer hoe vaak].

Daarom doe ik aangifte van een briefadres, op grond van de artikelen 2.23 en 2.39 van de Wet basisregistratie personen:

Briefadres: [adres]
Briefadresgever: [naam], die hiermee schriftelijk instemt. De verklaring van toestemming is bijgevoegd.

[Of, als niemand briefadresgever kan zijn: Ik heb niemand die briefadresgever kan zijn. Ik verzoek u mij ambtshalve in te schrijven op een briefadres, zo nodig op een adres van de gemeente (artikel 2.23, tweede en derde lid, Wet BRP).]

Ik ben bereid mijn situatie in een gesprek toe te lichten en stukken te laten zien. Ik verzoek u zo spoedig mogelijk te beslissen en mij, als u de aangifte niet overneemt, een schriftelijk besluit te sturen waartegen ik bezwaar kan maken.

Met vriendelijke groet,

[Handtekening]
[Naam]

Bijlage: verklaring van toestemming van de briefadresgever`},
 {title:T(`4. Attestation d’une personne qui t’a hébergée`,`4. Verklaring van iemand bij wie je sliep`),
  about:T(`Signée par l’hôte, pas par toi. Elle ne contient que ce que cette personne a vu elle-même. Une fausse attestation l’expose à des poursuites et ruine le dossier : si un point n’est pas vrai, on l’enlève.`,`Ondertekend door de gastheer of gastvrouw, niet door jou. Er staat alleen in wat die persoon zelf heeft gezien. Een valse verklaring is strafbaar en maakt het dossier kapot: klopt een punt niet, dan gaat het eruit.`),
  text:`VERKLARING

Ondergetekende,

Naam: [naam]
Geboortedatum: [datum]
Adres: [adres]

verklaart naar waarheid het volgende:

1. Ik ken [naam] sinds [jaar] als [zus / vriendin / kennis].
2. In de periode van [datum] tot [datum] heeft zij bij mij overnacht: [bijvoorbeeld: gemiddeld drie nachten per week, meestal van maandag tot donderdag].
3. Zij sliep [op de bank / in de logeerkamer]. Zij bewaarde bij mij [bijvoorbeeld: een tas met kleding en toiletspullen].
4. Zij betaalde mij [niets / € … per maand] voor het verblijf.
5. Voor zover ik uit eigen waarneming weet, sliep zij de overige nachten [bij … / op wisselende adressen]. [Alleen invullen wat u zelf weet.]
6. Ter ondersteuning voeg ik toe: [berichten, foto’s of andere stukken].

Ik weet dat deze verklaring kan worden gebruikt in een procedure bij de gemeente, het UWV of de rechter, en dat ik als getuige kan worden gehoord. Ik heb alleen opgeschreven wat ik zelf heb gezien en meegemaakt.

[Plaats], [datum]

[Handtekening]

Bijlage: kopie identiteitsbewijs, met BSN en pasfoto afgeschermd`},
 {title:T(`5. Signaler que tu avais moins de 27 ans`,`5. Melden dat je jonger dan 27 was`),
  about:T(`Signée par ta mère. Seulement si tu avais moins de 27 ans sur toute la période. La phrase entre crochets « wat niet het geval was » ne s’écrit que si elle est vraie.`,`Ondertekend door je moeder. Alleen als je de hele periode jonger dan 27 was. De zin tussen haken ‘wat niet het geval was’ schrijf je alleen als hij waar is.`),
  text:HEADER+`
Betreft: onderzoek naar mijn woonsituatie, kostendelersnorm niet van toepassing
Uw kenmerk: [kenmerk]
Burgerservicenummer: [BSN]

Geachte heer, mevrouw,

U onderzoekt of mijn dochter, [naam], geboren op [geboortedatum], haar hoofdverblijf in mijn woning heeft of heeft gehad.

Mijn dochter was in de hele periode waarop uw onderzoek ziet jonger dan 27 jaar. Zij wordt 27 op [datum]. Op grond van artikel 19a van de Participatiewet [bij een UWV-toeslag: artikel 2, negende lid, van de Toeslagenwet] is een persoon jonger dan 27 jaar geen kostendelende medebewoner. Ook als zij haar hoofdverblijf bij mij zou hebben gehad [wat niet het geval was], zou dat geen gevolgen hebben gehad voor de hoogte van mijn uitkering.

Ik verzoek u daarom:
1. mij schriftelijk mee te delen op welke wettelijke grondslag het onderzoek wordt voortgezet;
2. het onderzoek te beëindigen voor zover het gaat om de toepassing van de kostendelersnorm, en mij dat schriftelijk te bevestigen.

Met vriendelijke groet,

[Handtekening]
[Naam]

Bijlage: kopie identiteitsbewijs van mijn dochter [of: uittreksel BRP]`}
];

 {name:T(`Juridisch Loket`,`Juridisch Loket`),d:T(`<p>Premier conseil gratuit, par téléphone ou sur rendez-vous, et orientation vers un avocat. Téléphone gratuit 0800 8020 ; vérifie le numéro et les horaires sur juridischloket.nl.</p>`,`<p>Gratis eerste advies, telefonisch of op afspraak, en doorverwijzing naar een advocaat. Gratis nummer 0800 8020; controleer nummer en openingstijden op juridischloket.nl.</p>`)},

 {name:T(`Le service de l’état civil`,`Burgerzaken van de gemeente`),d:T(`<p>Pour mettre ton inscription en ordre : déménagement ou adresse postale. C’est un autre service que celui qui enquête sur l’aide, mais les informations circulent.</p>`,`<p>Om je inschrijving in orde te maken: verhuizing of briefadres. Het is een andere afdeling dan die het uitkeringsonderzoek doet, maar gegevens worden gedeeld.</p>`)},

 {name:T(`Plus d’argent pour vivre`,`Geen geld meer om van te leven`),d:T(`<p>Demandez à la commune une aide d’urgence, et à l’avocat une mesure provisoire au tribunal. Une assurance protection juridique ou un syndicat peuvent aussi payer l’avocat : vérifiez vos contrats.</p>`,`<p>Vraag de gemeente om noodhulp, en de advocaat om een voorlopige voorziening bij de rechtbank. Een rechtsbijstandverzekering of vakbond kan de advocaat ook betalen: kijk je polissen na.</p>`)}

/*END:help*/

/* ---------- moteur ---------- */
const $=s=>document.querySelector(s);
let lang=document.documentElement.lang==='nl'?'nl':'fr';
const tx=o=>o==null?'':typeof o==='string'?o:(o[lang]??o.fr);
const state={a:{},cp:{},ev:{},quiz:{},flip:{},gl:'',date:''};
const list=(arr,cls='')=>`<ul class="${cls}">${arr.map(x=>`<li>${tx(x)}</li>`).join('')}</ul>`;

const visibleQs=()=>QUESTIONS.filter(q=>!q.show||q.show(state.a));
function renderTree(){
  let out='<ol class="stops">',done=true;
  for(const q of visibleQs()){
    const cur=state.a[q.id];
    out+=`<li class="stop ${cur?'done':'here'}" id="q-${q.id}"><h3>${tx(q.q)}</h3>${q.help?`<p class="help">${tx(q.help)}</p>`:''}<div class="opts">`+
      q.options.map(o=>`<button type="button" data-act="ans" data-k="${q.id}" data-v="${o.v}" aria-pressed="${cur===o.v}">${tx(o.label)}${o.note?`<small>${tx(o.note)}</small>`:''}</button>`).join('')+'</div></li>';
    if(!cur){done=false;break;}
  }
  out+='</ol>';
  if(!done) return out+`<p class="remaining">${tx(UI.remaining)}</p>`;
  const a=state.a,h=HEADS.find(r=>r.when(a))||{level:'info',title:'',text:''};
  return out+`<div class="verdict lv-${h.level}" id="verdict"><header><h3>${tx(h.title)}</h3><p>${tx(h.text)}</p></header><div>`+
    BLOCKS.filter(r=>r.when(a)).map(r=>`<div class="blk ${r.level}"><h4>${tx(r.title)}</h4>${tx(r.body)}</div>`).join('')+
    renderTraps(true)+`<p><button type="button" class="linkbtn" data-act="reset">${tx(UI.reset)}</button></p></div></div>`;
}
const renderTraps=c=>c?`<div class="blk bad"><h4>${tx(T('Ce qui te ferait perdre encore plus','Waardoor je nog meer zou verliezen'))}</h4><ul>${TRAPS.map(x=>`<li>${tx(x.t)}</li>`).join('')}</ul><p><a href="#pieges">${tx(T('Voir pourquoi, point par point','Bekijk waarom, punt voor punt'))}</a></p></div>`
  :`<ul class="traps">${TRAPS.map(x=>`<li><b>${tx(x.t)}</b><br>${tx(x.d)}</li>`).join('')}</ul>`;
const node=n=>n.kids?`<details><summary>${tx(n.t)}</summary>${n.kids.map(node).join('')}</details>`:
  `<div class="leaf ${n.level||''}"><b>${tx(n.t)}</b>${n.body?`<p>${tx(n.body)}</p>`:''}</div>`;
const renderMap=()=>`<div class="tree">${MAP.map(node).join('')}</div>`;
function renderChecks(){
  const flagged=[];
  let out=CHECKS.map(g=>`<h3>${tx(g.group)}</h3>`+g.items.map(c=>{const s=state.cp[c.id]||'';
    if(s==='no'||s==='unk') flagged.push([c,s]);
    return `<div class="cp" data-s="${s}"><h4>${tx(c.act)}</h4><p>${tx(c.rule)}</p>${c.law?`<p class="law">${tx(c.law)}</p>`:''}
    <div class="tri">${[['ok',UI.cpOk],['no',UI.cpNo],['unk',UI.cpUnk]].map(([v,l])=>`<button type="button" data-act="cp" data-k="${c.id}" data-v="${v}" aria-pressed="${s===v}">${tx(l)}</button>`).join('')}</div>
    ${s==='no'||s==='unk'?`<div class="conseq"><b>${tx(UI.cpIfNo)} :</b> ${tx(c.ifNo)}</div>`:''}</div>`}).join('')).join('');
  out+=`<div class="summary"><h4 style="margin-top:0">${tx(UI.cpSum)}</h4>`+(flagged.length?
    `<ul>${flagged.map(([c,s])=>`<li>${tx(c.act)} <span class="tag ${s==='no'?'bad':'warn'}">${tx(s==='no'?UI.cpNo:UI.cpAsk)}</span></li>`).join('')}</ul>`:`<p>${tx(UI.cpNone)}</p>`)+'</div>';
  return out;
}
function renderEvidence(){
  const all=EVIDENCE.flatMap(g=>g.items),n=all.filter(i=>state.ev[i.id]).length;
  return `<p><progress max="${all.length||1}" value="${n}"></progress> ${n} / ${all.length} ${tx(UI.evDone)}</p>`+
    EVIDENCE.map(g=>`<h3>${tx(g.group)}</h3>${g.intro?`<p>${tx(g.intro)}</p>`:''}<div class="ev">`+
      g.items.map(i=>`<label><input type="checkbox" data-ev="${i.id}" ${state.ev[i.id]?'checked':''}><span>${tx(i.t)}${i.d?`<small>${tx(i.d)}</small>`:''}</span></label>`).join('')+'</div>').join('');
}
const renderDoDont=()=>DODONT.map(d=>`<h3>${tx(d.title)}</h3>${d.intro?`<p>${tx(d.intro)}</p>`:''}<div class="dodont"><div><h4>${tx(T('À faire','Wel doen'))}</h4>${list(d.do)}</div><div class="dont"><h4>${tx(T('À éviter','Niet doen'))}</h4>${list(d.dont)}</div></div>`).join('');
/* jours fériés légaux néerlandais (Algemene termijnenwet) ; les jours désignés chaque année par décret ne sont pas inclus */
function holiday(x){ const y=x.getFullYear(),a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),n=h+l-7*m+114;
  const key=t=>t.getMonth()*100+t.getDate(), off=p=>{const t=new Date(y,Math.floor(n/31)-1,n%31+1,12);t.setDate(t.getDate()+p);return key(t)};
  return [1,327,405,1125,1126,off(-2),off(1),off(39),off(50)].includes(key(x)); }   // Nouvel An, fête du Roi, 5 mai, Noël, Vendredi saint, lundi de Pâques, Ascension, lundi de Pentecôte
function lastDay(v){ if(!v) return ''; const d=new Date(v+'T12:00'); d.setDate(d.getDate()+42);
  while(d.getDay()===0||d.getDay()===6||holiday(d)) d.setDate(d.getDate()+1);
  return d.toLocaleDateString(lang==='nl'?'nl-NL':'fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
const renderSteps=()=>`<ol class="steps">${STEPS.map(s=>`<li><b>${tx(s.t)}</b><div>${tx(s.d)}</div></li>`).join('')}</ol>
  <div class="calc"><label for="dd"><b>${tx(UI.calcQ)}</b></label><br><input type="date" id="dd" value="${state.date}">
  <output id="ddo">${state.date?tx(UI.calcA)+' '+lastDay(state.date):''}</output><p class="law">${tx(UI.calcNote)}</p></div>`;
const renderLetters=()=>LETTERS.map((l,i)=>`<details class="fold"><summary>${tx(l.title)}</summary><div><p>${tx(l.about)}</p><pre id="let-${i}">${l.text}</pre><button type="button" class="btn" data-act="copy" data-k="${i}">${tx(UI.copy)}</button></div></details>`).join('');
const glItems=()=>{const f=state.gl.toLowerCase();return GLOSSARY.filter(g=>!f||(g.nl+' '+tx(g.d)).toLowerCase().includes(f)).map(g=>`<dt class="nl">${g.nl}</dt><dd>${tx(g.d)}</dd>`).join('')};
const renderGlossary=()=>`<input class="search" type="search" id="gls" placeholder="${tx(UI.search)}" value="${state.gl}"><dl class="gl" id="gll">${glItems()}</dl>`;
const renderHelp=()=>`<div class="help-list">${HELP.map(h=>`<div><h4>${tx(h.name)}</h4>${tx(h.d)}</div>`).join('')}</div>`+
  (SOURCES.length?`<h3>${tx(T('Sources','Bronnen'))}</h3><ul class="src">${SOURCES.map(s=>`<li>${s.url?`<a href="${s.url}" rel="noopener">${tx(s.t)}</a>`:tx(s.t)}</li>`).join('')}</ul>`:'');

/*DATA:sections*/
const SECTIONS=[
  {id:'parcours',name:T('Ton parcours','Jouw route'),render:renderTree,
   intro:T('Une dizaine de questions, une minute. À la fin : où tu te situes, comment t’expliquer, quoi faire en premier, et ce qu’il ne faut surtout pas faire. Change une réponse quand tu veux pour voir une autre branche.','Een tiental vragen, één minuut. Aan het eind: waar je staat, hoe je het uitlegt, wat je eerst doet, en wat je vooral niet moet doen. Verander een antwoord wanneer je wilt om een andere vertakking te zien.')},
  {id:'carte',name:T('Toutes les branches','Alle vertakkingen'),render:renderMap,
   intro:T('Toutes les possibilités d’un coup d’œil, sans répondre aux questions. Vert : favorable. Jaune : à surveiller. Rouge : défavorable. Déplie ce qui t’intéresse.','Alle mogelijkheden in één oogopslag, zonder vragen te beantwoorden. Groen: gunstig. Geel: opletten. Rood: ongunstig. Klap open wat je wilt zien.')},
  {id:'pieges',name:T('Là où on se fait coincer','Waar het misgaat'),render:()=>renderTraps(false),
   intro:T('Les dossiers ne se perdent pas seulement sur les faits : ils se perdent sur ces dix réflexes. Pour chacun, pourquoi il se retourne contre toi.','Zaken worden niet alleen op de feiten verloren, maar ook op deze tien reflexen. Bij elk staat waarom het zich tegen je keert.')},
  {id:'controle',name:T('L’enquête','Het onderzoek'),render:renderChecks,
   intro:T('L’administration aussi doit suivre des règles. Pour chaque point, indique si elle l’a respecté. Une règle violée fait tomber la preuve concernée, pas forcément tout le dossier : c’est à l’avocat d’en tirer le maximum.','Ook de overheid moet zich aan regels houden. Geef bij elk punt aan of dat is gebeurd. Een geschonden regel haalt het betrokken bewijs onderuit, niet per se het hele dossier: de advocaat moet er het maximale uit halen.')},
  {id:'preuves',name:T('Tes preuves','Jouw bewijs'),render:()=>renderEvidence()+renderDoDont(),
   intro:T('Des traces vraies, qui existaient déjà. Coche ce que vous avez rassemblé.','Echte sporen, die er al waren. Vink aan wat jullie hebben verzameld.')},
  {id:'etapes',name:T('Étapes et délais','Stappen en termijnen'),render:renderSteps,
   intro:T('La procédure dans l’ordre, et le délai qu’il ne faut jamais rater.','De procedure op volgorde, en de termijn die je nooit mag missen.')},
  {id:'lettres',name:T('Lettres types','Voorbeeldbrieven'),render:renderLetters,
   intro:T('Cinq modèles en néerlandais. Remplace tout ce qui est entre crochets, et n’écris que ce qui est vrai. Fais-les relire par l’avocat si tu en as un.','Vijf voorbeelden. Vervang alles tussen vierkante haken en schrijf alleen op wat waar is. Laat ze nalezen door de advocaat als je die hebt.')},
  {id:'lexique',only:'fr',name:T('Lexique','Woordenlijst'),render:renderGlossary},
  {id:'aide',name:T('Où trouver de l’aide','Waar vind je hulp'),render:renderHelp,
   intro:T('Un avocat spécialisé connaît les juges, la commune et les délais. Commence par là.','Een gespecialiseerde advocaat kent de rechters, de gemeente en de termijnen. Begin daar.')}
];
/*END:sections*/

const draw=id=>{$('#b-'+id).innerHTML=SECTIONS.find(s=>s.id===id).render()};
function renderAll(){
  document.documentElement.lang=lang; document.title=tx(UI.title);
  $('#brand').textContent=tx(UI.brand);
  document.querySelectorAll('#lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===lang));
  const secs=SECTIONS.filter(s=>!s.only||s.only===lang);   // le lexique néerlandais-français ne sert qu'au lecteur français
  $('#nav').innerHTML=secs.map(s=>`<a href="#${s.id}">${tx(s.name)}</a>`).join('');
  $('#hero').innerHTML=`<h1>${tx(UI.title)}</h1><p class="sub">${tx(UI.sub)}</p><div class="notes"><p>${tx(UI.n1)}</p><p>${tx(UI.n2)}</p><p>${tx(UI.n3)}</p></div>`;
  $('main').innerHTML=secs.map(s=>`<section id="${s.id}"><h2>${tx(s.name)}</h2>${s.intro?`<p class="lead">${tx(s.intro)}</p>`:''}<div class="body" id="b-${s.id}"></div></section>`).join('');
  secs.forEach(s=>draw(s.id));
  $('#foot').textContent=tx(UI.foot);
  spy();
}
const ACT={
  lang:k=>{lang=k;renderAll()},
  ans:(k,v)=>{state.a[k]=v;draw('parcours');
    const next=visibleQs().find(q=>!state.a[q.id]);
    (next?$('#q-'+next.id):$('#verdict'))?.scrollIntoView({block:'center'})},
  reset:()=>{state.a={};draw('parcours');$('#parcours').scrollIntoView()},
  cp:(k,v)=>{state.cp[k]=state.cp[k]===v?'':v;draw('controle')},
  copy:(k,v,b)=>{const t=$('#let-'+k).textContent;
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const r=document.createRange();r.selectNodeContents($('#let-'+k));const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy')})
      .finally(()=>{b.textContent=tx(UI.copied)})}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)ACT[b.dataset.act](b.dataset.k,b.dataset.v,b)});
document.addEventListener('change',e=>{
  if(e.target.dataset.ev){state.ev[e.target.dataset.ev]=e.target.checked;draw('preuves')}
  if(e.target.id==='dd'){state.date=e.target.value;$('#ddo').textContent=state.date?tx(UI.calcA)+' '+lastDay(state.date):''}
});
document.addEventListener('input',e=>{if(e.target.id==='gls'){state.gl=e.target.value;$('#gll').innerHTML=glItems()}});
addEventListener('beforeprint',()=>document.querySelectorAll('details').forEach(d=>d.open=true));
let io;
function spy(){ io?.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)document.querySelectorAll('#nav a').forEach(a=>{const on=a.getAttribute('href')==='#'+e.target.id;a.classList.toggle('here',on);if(on){const n=$('#nav');n.scrollLeft=a.offsetLeft-n.offsetLeft-(n.clientWidth-a.offsetWidth)/2}})}),{rootMargin:'-30% 0px -60% 0px'});
  document.querySelectorAll('main>section').forEach(s=>io.observe(s)); }
renderAll();
document.getElementById('nojs').remove();   // le message ne reste visible que si ce script n'a pas tourné
</script>
